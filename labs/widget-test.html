<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Widget-Test</title>
<style>body{background:#090d12;color:#eee;font-family:sans-serif;margin:0;padding:10px}.b{height:420px;margin:10px 0;border:1px solid #333}.s{height:60px}h3{margin:6px 0}</style></head><body>
<h3>Ticker</h3><div id="t" class="s"></div>
<h3>Heatmap SPX500</h3><div id="h1" class="b"></div>
<h3>Heatmap DAX</h3><div id="h2" class="b"></div>
<h3>Mini XETR:SIE</h3><div id="m1" class="b" style="height:220px"></div>
<h3>Mini NASDAQ:WMT</h3><div id="m2" class="b" style="height:220px"></div>
<h3>TA XETR:PBB</h3><div id="ta" class="b"></div>
<script>
function tv(id,name,cfg){var c=document.getElementById(id);var w=document.createElement('div');w.className='tradingview-widget-container';w.style.height='100%';var i=document.createElement('div');i.className='tradingview-widget-container__widget';i.style.height='100%';w.appendChild(i);var s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-'+name+'.js';s.async=true;s.text=JSON.stringify(cfg);w.appendChild(s);c.appendChild(w);}
tv('t','ticker-tape',{symbols:[{proName:'FOREXCOM:SPXUSD',title:'S&P 500'},{proName:'FOREXCOM:NSXUSD',title:'Nasdaq 100'},{proName:'XETR:DAX',title:'DAX'},{proName:'FX_IDC:EURUSD',title:'EUR/USD'},{proName:'TVC:GOLD',title:'Gold'},{proName:'TVC:US10Y',title:'US 10J'}],showSymbolLogo:true,isTransparent:true,displayMode:'adaptive',colorTheme:'dark',locale:'de_DE'});
var hm=function(ds){return {exchanges:[],dataSource:ds,grouping:'sector',blockSize:'market_cap_basic',blockColor:'change',locale:'de_DE',symbolUrl:'',colorTheme:'dark',hasTopBar:false,isDataSetEnabled:false,isZoomEnabled:true,hasSymbolTooltip:true,isMonoSize:false,width:'100%',height:'100%'}};
tv('h1','stock-heatmap',hm('SPX500'));tv('h2','stock-heatmap',hm('DAX'));
var mini=function(s){return {symbol:s,width:'100%',height:'100%',locale:'de_DE',dateRange:'12M',colorTheme:'dark',isTransparent:true,autosize:true,largeChartUrl:''}};
tv('m1','mini-symbol-overview',mini('XETR:SIE'));tv('m2','mini-symbol-overview',mini('NASDAQ:WMT'));
tv('ta','technical-analysis',{interval:'1D',width:'100%',isTransparent:true,height:'100%',symbol:'XETR:PBB',showIntervalTabs:true,displayMode:'single',locale:'de_DE',colorTheme:'dark'});
</script></body></html>
