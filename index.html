<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#090d12">
<title>Börsenradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ein dunkles Terminal-Thema. Kern ist das Signal-Spektrum: jede Aktie sitzt auf einer Achse von Short (-12) bis Long (+12). */
:root {
  --bg: #090d12;
  --bg-2: #0d131a;
  --surface: #121a23;
  --surface-2: #17212c;
  --line: #223042;
  --ink: #e9eff6;
  --muted: #8a9bb0;
  --faint: #5d6e83;
  --long: #34d98f;
  --short: #ff6363;
  --neutral: #f4bb4f;
  --focus: #8fb4ff;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(52, 217, 143, .07), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(143, 180, 255, .06), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}
a { color: var(--focus); text-decoration-color: rgba(143, 180, 255, .4); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); text-wrap: balance; letter-spacing: -.01em; line-height: 1.1; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* Kopfleiste */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(9, 13, 18, .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.logo svg { width: 28px; height: 28px; }
.bar .spacer { flex: 1; }
.bar .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
select { font: inherit; font-family: var(--mono); font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.c-long { color: var(--long); } .c-short { color: var(--short); } .c-neutral { color: var(--neutral); }
.bg-long { background: rgba(52, 217, 143, .1); } .bg-short { background: rgba(255, 99, 99, .1); } .bg-neutral { background: rgba(244, 187, 79, .1); }

main.wrap { display: grid; gap: 28px; padding-top: 36px; padding-bottom: 64px; }
main.wrap > * { min-width: 0; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero > * { min-width: 0; }
@media (max-width: 480px) { .tabs { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; } .tabs button { padding: 8px 4px; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .tabs .cnt { display: none; } .bar .ctl { width: 100%; } }
.hero h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 800; letter-spacing: -.03em; margin: 8px 0 12px; }
.hero h1 .accent { color: var(--hc); }
.hero p.lead { margin: 0; color: #c3cfdc; font-size: 16px; max-width: 62ch; }
.status { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 14px; }
.status-top { display: flex; align-items: center; gap: 14px; }
.lights { display: flex; gap: 6px; background: #05080b; border: 1px solid var(--line); padding: 6px 8px; border-radius: 999px; }
.lights span { width: 14px; height: 14px; border-radius: 50%; background: #1b2531; }
.lights .on.r { background: var(--short); box-shadow: 0 0 14px var(--short); }
.lights .on.y { background: var(--neutral); box-shadow: 0 0 14px var(--neutral); }
.lights .on.g { background: var(--long); box-shadow: 0 0 14px var(--long); }
.status-top b { font-family: var(--display); font-size: 18px; }
.status ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; color: #c3cfdc; }
.status li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; }
.status li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--hc); margin-top: 8px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.counts .pill { font-family: var(--mono); }

/* Live-Laufband und eingebettete Live-Daten */
.tape { border-bottom: 1px solid var(--line); background: rgba(9, 13, 18, .55); }
.tape iframe { display: block; width: 100%; height: 46px; border: 0; }
iframe.tv { display: block; width: 100%; border: 0; background: transparent; }
.livenote { font-size: 12px; color: var(--faint); }

/* Abschnittsköpfe */
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.sec-head p { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 70ch; }
.card-box { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }

/* Top-Ideen */
.ideas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .ideas { grid-template-columns: 1fr; } }
.ilist { display: grid; gap: 8px; align-content: start; }
.ilist h3 { font-size: 15px; color: var(--cc); display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 8px; border-bottom: 2px solid var(--cc); margin-bottom: 4px; }
.ilist h3 span { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 400; }
.idea { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); transition: border-color .2s, background .2s, transform .2s; }
.idea:hover { border-color: var(--cc); background: var(--surface-2); transform: translateY(-1px); }
.idea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.idea .rk { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--cc); align-self: start; }
.idea .nm { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; }
.idea .nm small { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.idea .hl { grid-column: 2 / 4; font-size: 13px; color: #b9c6d4; line-height: 1.45; }
.idea .act { margin-top: 4px; }
.ilist .empty { color: var(--faint); font-size: 13px; padding: 10px 4px; }

/* Heatmaps */
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.tm { position: relative; width: 100%; height: 430px; }
@media (max-width: 640px) { .tm { height: 620px; } }
.tm .grp { position: absolute; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 0 2px; white-space: nowrap; overflow: hidden; }
.cell { position: absolute; box-sizing: border-box; border: 0; border-radius: 6px; cursor: pointer; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1px; overflow: hidden; padding: 4px; transition: filter .15s, box-shadow .15s; font: inherit; }
.cell:hover, .cell:focus-visible { filter: brightness(1.18); box-shadow: 0 0 0 2px rgba(255, 255, 255, .55) inset; outline: none; z-index: 2; }
.cell .ct { font-family: var(--mono); font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
.cell .cn { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cell .cs { font-family: var(--mono); font-size: 13px; font-weight: 600; opacity: .95; }
.cell .ca { font-size: 11px; opacity: .8; white-space: nowrap; }
.scale { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.scale i { display: block; width: 180px; max-width: 40vw; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #d0383b, #5a2a2e, #2a323c, #1f5c40, #12a35f); }
.hm-live { height: 560px; border-radius: 10px; overflow: hidden; }
@media (max-width: 640px) { .hm-live { height: 480px; } }

/* Watchlist-Tabelle */
.wl-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.tbl-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); }
table.wl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; }
.wl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--bg-2); }
.wl th.c, .wl td.c { text-align: center; }
.wl th button { all: unset; cursor: pointer; } .wl th button:hover { color: var(--ink); } .wl th button:focus-visible { outline: 2px solid var(--focus); }
.wl th button[aria-sort="none"]::after { content: " ↕"; color: var(--faint); }
.wl th button[aria-sort="descending"]::after { content: " ↓"; color: var(--ink); } .wl th button[aria-sort="ascending"]::after { content: " ↑"; color: var(--ink); }
.wl td { padding: 10px 12px; border-bottom: 1px solid rgba(34, 48, 66, .6); vertical-align: middle; }
.wl tbody tr { cursor: pointer; transition: background .15s; }
.wl tbody tr:hover { background: var(--surface); }
.wl tbody tr:last-child td { border-bottom: 0; }
.wl .nmb { all: unset; cursor: pointer; display: grid; } .wl .nmb:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.wl .nmb b { font-family: var(--display); font-size: 16px; } .wl .nmb span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hc { display: inline-grid; place-items: center; width: 34px; height: 26px; border-radius: 6px; font-family: var(--mono); font-size: 12px; font-weight: 600; color: #fff; }
.sc { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 600; }
.sc i { display: block; width: 54px; height: 6px; border-radius: 3px; background: #1a2430; position: relative; overflow: hidden; }
.sc i b { position: absolute; top: 0; bottom: 0; }
details.live { margin-top: 14px; }
details.live summary { cursor: pointer; color: var(--focus); font-size: 14px; }
details.live .box { margin-top: 10px; height: 620px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg-2); }

/* Empfehlung und Live-Daten in der Detailansicht */
.reco { border: 1px solid var(--cc); border-radius: 14px; padding: 16px; background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 12%, transparent), transparent); display: grid; gap: 10px; }
.reco .big { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--cc); letter-spacing: -.02em; }
.reco p { margin: 0; font-size: 14px; color: #d0dae5; }
.reco p b { color: var(--ink); }
.charts { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 640px) { .charts { grid-template-columns: 1fr; } }
.charts > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

/* Kennzahlen */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; align-content: start; }
.tile .n { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.tile .v.sm { font-size: 15px; }
.tile .d { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.tile .d span { color: var(--faint); font-weight: 400; }
.tile .tnote { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tile .src { font-size: 11px; }
.up { color: var(--long); } .down { color: var(--short); } .warn { color: var(--short); }

/* Tabs */
.tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; display: inline-flex; gap: 4px; padding: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; }
.tabs button { white-space: nowrap; background: transparent; border: 0; padding: 8px 16px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset; }
.tabs .cnt { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 4px; }
.panel[hidden] { display: none; }

/* Zuversicht und Punktering */
.conf { display: inline-flex; gap: 3px; align-items: center; }
.conf i { width: 6px; height: 6px; border-radius: 50%; background: #2a3746; }
.conf i.on { background: var(--cc); }
.ring { --p: 50; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--cc) calc(var(--p) * 1%), #1d2834 0); }
.ring b { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--cc); }

/* Nachrichten */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.news { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 800px) { .news { grid-template-columns: 1fr; } }
.news article { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.news .top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.news .tag { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--focus); }
.news h3 { font-size: 18px; font-weight: 700; }
.news p { margin: 0; color: #c3cfdc; font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }

/* Termine */
.timeline { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 0; max-width: 720px; }
.timeline li { display: grid; grid-template-columns: 110px 18px 1fr; gap: 12px; align-items: start; padding-bottom: 18px; }
.timeline .when { font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: right; padding-top: 1px; }
.timeline .dot { position: relative; height: 100%; }
.timeline .dot::before { content: ""; position: absolute; left: 4px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--focus); box-shadow: 0 0 10px var(--focus); }
.timeline .dot::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: -18px; width: 2px; background: var(--line); }
.timeline li:last-child .dot::after { display: none; }
.timeline .what { font-size: 14px; }

/* Detailansicht als Seitenpanel */
.scrim { position: fixed; inset: 0; background: rgba(3, 5, 8, .6); backdrop-filter: blur(2px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--bg-2); border-left: 1px solid var(--line); z-index: 50; transform: translateX(102%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.d-top .nav { display: flex; gap: 6px; }
.d-body { overflow: auto; padding: 22px clamp(16px, 3vw, 28px) 40px; display: grid; gap: 24px; align-content: start; }
.d-hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.d-hero h2 { font-size: clamp(30px, 5vw, 42px); font-weight: 800; letter-spacing: -.03em; }
.d-hero .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.d-hero .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.ring.big { width: 92px; height: 92px; }
.ring.big b { width: 76px; height: 76px; font-size: 22px; background: var(--bg-2); display: grid; align-content: center; line-height: 1.1; }
.ring.big b small { font-size: 10px; color: var(--muted); font-weight: 400; }
.sec { display: grid; gap: 10px; }
.sec > p { margin: 0; color: #d0dae5; max-width: 70ch; }
.headline { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--ink); }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.bars { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 150px 1fr 34px; gap: 12px; align-items: center; font-size: 13px; color: #c3cfdc; }
.btrack { position: relative; height: 10px; background: #1a2430; border-radius: 5px; }
.btrack::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--faint); }
.bfill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.bfill.pos { left: 50%; background: var(--long); }
.bfill.neg { right: 50%; background: var(--short); }
.brow .v { font-family: var(--mono); text-align: right; }
@media (max-width: 480px) { .brow { grid-template-columns: 112px 1fr 30px; } }
.sum { font-size: 13px; color: var(--muted); }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .pc { grid-template-columns: 1fr; } }
.pcb { border-radius: 14px; padding: 14px 16px; border: 1px solid; }
.pcb h4 { font-size: 15px; margin-bottom: 8px; }
.pcb ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; color: #d0dae5; }
.pcb.l { border-color: rgba(52, 217, 143, .35); background: rgba(52, 217, 143, .06); } .pcb.l h4 { color: var(--long); }
.pcb.s { border-color: rgba(255, 99, 99, .35); background: rgba(255, 99, 99, .06); } .pcb.s h4 { color: var(--short); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .facts { grid-template-columns: 1fr; } }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.fact h4 { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fact p, .fact li { margin: 0; font-size: 14px; color: #d0dae5; }
.fact ul { margin: 0; padding-left: 18px; }
.srcs { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; }
.srcs span { color: var(--muted); }

footer { border-top: 1px solid var(--line); padding: 20px 0 40px; display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
footer p { margin: 0; max-width: 110ch; }

/* Login */
.gate { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 40px 16px; position: relative; overflow: hidden; }
.radar { position: absolute; width: min(760px, 140vw); aspect-ratio: 1; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); background: repeating-radial-gradient(circle, transparent 0 59px, rgba(52, 217, 143, .12) 60px 61px); mask: radial-gradient(circle, #000 55%, transparent 72%); -webkit-mask: radial-gradient(circle, #000 55%, transparent 72%); pointer-events: none; }
.radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(52, 217, 143, .28), transparent 18%); animation: sweep 6s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
.login { position: relative; width: min(420px, 100%); background: rgba(18, 26, 35, .88); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: grid; gap: 12px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
.login h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.login p { margin: 0; color: var(--muted); font-size: 14px; }
.login label { font-size: 13px; color: #c3cfdc; }
.login input[type="password"] { font: inherit; font-family: var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.login input[type="password"]:focus { border-color: var(--long); outline: none; box-shadow: 0 0 0 3px rgba(52, 217, 143, .2); }
.login .rem { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; cursor: pointer; background: var(--long); color: #052215; }
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .6; cursor: progress; }
.err { color: var(--short); font-size: 14px; min-height: 1.3em; }
.state { margin: 40px auto; max-width: 560px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; }

@media (prefers-reduced-motion: reduce) {
  .radar::after { animation: none; }
  .drawer, .scrim, .idea, .cell { transition: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="logo" aria-label="Börsenradar">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#34d98f" stroke-opacity=".35"/><circle cx="16" cy="16" r="9" fill="none" stroke="#34d98f" stroke-opacity=".5"/><circle cx="16" cy="16" r="4" fill="none" stroke="#34d98f" stroke-opacity=".8"/><path d="M16 16 L28 9" stroke="#34d98f" stroke-width="2" stroke-linecap="round"/><circle cx="23" cy="20" r="2" fill="#ff6363"/><circle cx="10" cy="9" r="2" fill="#34d98f"/></svg>
      Börsenradar
    </div>
    <div class="spacer"></div>
    <div class="ctl" id="ctl" hidden>
      <label for="reportSelect">Bericht</label>
      <select id="reportSelect"></select>
      <span id="nextUpdate"></span>
      <button type="button" class="ghost" id="logoutBtn">Abmelden</button>
    </div>
  </div>
</header>

<div id="app"><div class="state">Seite wird geladen.</div></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="d-top">
    <div class="nav">
      <button type="button" class="ghost" id="prevBtn" aria-label="Vorherige Aktie">Zurück</button>
      <button type="button" class="ghost" id="nextBtn" aria-label="Nächste Aktie">Weiter</button>
    </div>
    <button type="button" class="ghost" id="closeBtn">Schließen</button>
  </div>
  <div class="d-body" id="dBody"></div>
</aside>

<script>
(function () {
  "use strict";
  var reports = [];
  var current = null;
  var tab = "watch";
  var newsFilter = "Alle";
  var openTicker = null;
  var cache = {};
  var privKey = null;
  var KEY_STORE = "boersenradar.key";
  var lastFocus = null;

  var CAT = [
    ["ereignisse", "Ereignisse (x2)"],
    ["analysten", "Analysten"],
    ["trend", "Trend und Momentum"],
    ["positionierung", "Positionierung"],
    ["qualitaet", "Qualität und Bilanz"],
    ["bewertung", "Bewertung"]
  ];
  var SIG = {
    long: { label: "Long", cls: "long", col: "Long" },
    neutral: { label: "Neutral", cls: "neutral", col: "Neutral" },
    short: { label: "Short-Kandidat", cls: "short", col: "Short-Kandidaten" }
  };

  /* Hilfsfunktionen */
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : null; }
  function link(s) {
    var u = safeUrl(s && s.url);
    var name = esc((s && (s.name || s.title)) || "Quelle");
    return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + name + "</a>" : name;
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function total(p) {
    var s = p.scores || {}, t = 0;
    CAT.forEach(function (c) { var v = Number(s[c[0]]) || 0; t += c[0] === "ereignisse" ? v * 2 : v; });
    return t;
  }
  function sig(p) { return SIG[p.signal] || SIG.neutral; }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    return m ? m[3] + "." + m[2] + "." + m[1] : esc(iso);
  }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n); }
  function confDots(c) {
    var n = c === "hoch" ? 3 : c === "mittel" ? 2 : 1;
    return '<span class="conf" title="Zuversicht ' + esc(c) + '"><i class="on"></i><i' + (n > 1 ? ' class="on"' : "") + "></i><i" + (n > 2 ? ' class="on"' : "") + "></i></span>";
  }
  function ring(p, big) {
    var t = total(p), pct = Math.min(Math.abs(t), 12) / 12 * 100;
    return '<span class="ring' + (big ? " big" : "") + '" style="--p:' + pct.toFixed(1) + ';--cc:var(--' + sig(p).cls + ')"><b>' + signed(t) + (big ? "<small>Punkte</small>" : "") + "</b></span>";
  }
  function lightInfo(r) {
    var st = (r.light && r.light.status) || "gelb";
    var k = st === "gruen" ? "g" : st === "rot" ? "r" : "y";
    return { k: k, color: k === "g" ? "var(--long)" : k === "r" ? "var(--short)" : "var(--neutral)", name: k === "g" ? "Grün" : k === "r" ? "Rot" : "Gelb", longMin: k === "r" ? 5 : 4, shortMax: k === "g" ? -5 : -4 };
  }
  function setState(msg) { document.getElementById("app").innerHTML = '<div class="state">' + esc(msg) + "</div>"; }
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Live-Daten von TradingView: nur als fremde iframes, kein fremdes Skript auf dieser Seite */
  var TV_RE = /^[A-Z_]{2,12}:[A-Z0-9._]{1,15}$/;
  var EXCH = { xetra: "XETR", nasdaq: "NASDAQ", nyse: "NYSE" };
  function tvSym(p) {
    if (p && TV_RE.test(String(p.tvSymbol || ""))) return p.tvSymbol;
    var ex = EXCH[String((p && p.market) || "").toLowerCase()];
    var s = ex ? ex + ":" + String(p.ticker || "").toUpperCase() : "";
    return TV_RE.test(s) ? s : null;
  }
  function tvFrame(name, cfg, title, height, lazy) {
    var src = "https://www.tradingview-widget.com/embed-widget/" + name + "/?locale=de_DE#" + encodeURIComponent(JSON.stringify(cfg));
    return '<iframe class="tv" title="' + esc(title) + '" src="' + esc(src) + '" style="height:' + height + '"' + (lazy ? ' loading="lazy"' : "") +
      ' sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  }
  var TAPE = [
    ["FOREXCOM:SPXUSD", "S&P 500"], ["FOREXCOM:NSXUSD", "Nasdaq 100"], ["FOREXCOM:DJI", "Dow Jones"], ["XETR:DAX", "DAX"],
    ["FX_IDC:EURUSD", "EUR/USD"], ["TVC:US10Y", "US-Rendite 10J"], ["TVC:GOLD", "Gold"], ["TVC:UKOIL", "Brent"], ["BITSTAMP:BTCUSD", "Bitcoin"]
  ];
  function tapeHtml() {
    return '<div class="tape">' + tvFrame("ticker-tape", { symbols: TAPE.map(function (s) { return { proName: s[0], title: s[1] }; }), showSymbolLogo: true, isTransparent: true, displayMode: "compact", colorTheme: "dark", locale: "de_DE" }, "Laufband mit Live-Kursen", "46px", false) + "</div>";
  }
  var HM_SRC = [["SPX500", "S&P 500"], ["NASDAQ100", "Nasdaq 100"], ["DAX", "DAX"]];
  var HM_PER = [["change", "Tag"], ["Perf.W", "Woche"], ["Perf.1M", "Monat"], ["Perf.YTD", "Seit 1.1."]];
  var hmSrc = "SPX500", hmPer = "change";
  try { var hs = JSON.parse(localStorage.getItem("boersenradar.hm") || "{}"); if (HM_SRC.some(function (x) { return x[0] === hs.s; })) hmSrc = hs.s; if (HM_PER.some(function (x) { return x[0] === hs.p; })) hmPer = hs.p; } catch (e) {}
  function liveHeatmap() {
    var el = document.getElementById("hmLive");
    if (!el) return;
    el.innerHTML = tvFrame("stock-heatmap", { exchanges: [], dataSource: hmSrc, grouping: "sector", blockSize: "market_cap_basic", blockColor: hmPer, locale: "de_DE", symbolUrl: "", colorTheme: "dark", hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true, hasSymbolTooltip: true, isMonoSize: false, width: "100%", height: "100%" }, "Markt-Heatmap", "100%", true);
    try { localStorage.setItem("boersenradar.hm", JSON.stringify({ s: hmSrc, p: hmPer })); } catch (e) {}
  }

  /* Empfehlung aus Signal und Zuversicht */
  function action(p) {
    var t = total(p);
    if (p.signal === "long") {
      if (p.confidence === "hoch") return { label: "Kaufen", short: "Kaufen", cls: "long", rank: 5 };
      if (p.confidence === "mittel") return { label: "Kaufen, klein beginnen", short: "Kaufen (klein)", cls: "long", rank: 4 };
      return { label: "Beobachten, Kaufneigung", short: "Beobachten", cls: "long", rank: 3 };
    }
    if (p.signal === "short") return { label: "Meiden", short: "Meiden", cls: "short", rank: 0 };
    if (t >= 2) return { label: "Beobachten, eher positiv", short: "Beobachten", cls: "neutral", rank: 2 };
    if (t <= -2) return { label: "Beobachten, eher negativ", short: "Beobachten", cls: "neutral", rank: 1 };
    return { label: "Beobachten", short: "Beobachten", cls: "neutral", rank: 1.5 };
  }
  function actPill(p, full) { var a = action(p); return '<span class="pill act c-' + a.cls + " bg-" + a.cls + '">' + esc(full ? a.label : a.short) + "</span>"; }

  /* Farbskala Rot, Grau, Grün */
  var C0 = [42, 50, 60], CP1 = [31, 92, 64], CP2 = [18, 163, 95], CN1 = [90, 42, 46], CN2 = [208, 56, 59];
  function mix(a, b, f) { return "rgb(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * f); }).join(",") + ")"; }
  function heat(t, max) {
    if (!t) return mix(C0, C0, 0);
    var f = Math.min(Math.abs(t) / max, 1);
    return t > 0 ? mix(CP1, CP2, f) : mix(CN1, CN2, f);
  }

  /* Bericht darstellen */
  function render() {
    var r = current;
    if (!r) return;
    var L = lightInfo(r);
    var picks = arr(r.picks).slice().sort(function (a, b) { return total(b) - total(a); });
    var cnt = { long: 0, neutral: 0, short: 0 };
    picks.forEach(function (p) { cnt[SIG[p.signal] ? p.signal : "neutral"]++; });
    document.getElementById("nextUpdate").textContent = r.nextUpdate ? "Nächstes Update " + fmtDate(r.nextUpdate) : "";

    var h = tapeHtml() + '<main class="wrap">';
    h += '<section class="hero" style="--hc:' + L.color + '"><div>';
    h += '<div class="eyebrow">Bericht vom ' + fmtDate(r.date) + " · Marktampel " + L.name + "</div>";
    h += '<h1><span class="accent">' + esc((r.light && r.light.label) || "Marktlage") + "</span></h1>";
    h += '<p class="lead">' + esc(r.summary || "") + "</p></div>";
    h += '<div class="status"><div class="status-top"><div class="lights" aria-hidden="true"><span class="r' + (L.k === "r" ? " on" : "") + '"></span><span class="y' + (L.k === "y" ? " on" : "") + '"></span><span class="g' + (L.k === "g" ? " on" : "") + '"></span></div><b>Marktampel ' + L.name + "</b></div>";
    h += '<p style="margin:0;font-size:14px;color:#c3cfdc">' + esc((r.light && r.light.text) || "") + "</p>";
    h += "<ul>" + arr(r.light && r.light.reasons).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    h += '<div class="counts"><span class="pill c-long bg-long">' + cnt.long + ' Long</span><span class="pill c-neutral bg-neutral">' + cnt.neutral + ' Neutral</span><span class="pill c-short bg-short">' + cnt.short + " Short</span></div>";
    h += "</div></section>";

    h += '<section aria-label="Kennzahlen aus dem Bericht"><div class="tiles">';
    arr(r.indices).forEach(function (ix) {
      var isRate = /rendite|zins/i.test(ix.name);
      var dc = ix.changeDir === "up" ? (isRate ? "warn" : "up") : ix.changeDir === "down" ? (isRate ? "up" : "down") : "";
      var arrow = ix.changeDir === "up" ? "▲ " : ix.changeDir === "down" ? "▼ " : "";
      h += '<div class="tile"><span class="n">' + esc(ix.name) + '</span><span class="v' + (String(ix.value || "").length > 10 ? " sm" : "") + '">' + esc(ix.value) + "</span>";
      h += '<span class="d ' + dc + '">' + arrow + esc(ix.change) + " <span>" + esc(ix.asOf || "") + "</span></span>";
      if (ix.note) h += '<span class="tnote">' + esc(ix.note) + "</span>";
      h += '<span class="src">' + arr(ix.sources).map(link).join(" · ") + "</span></div>";
    });
    h += "</div></section>";

    /* Empfehlungen: Top-Ideen und Signal-Heatmap */
    var buys = picks.filter(function (p) { return p.signal === "long"; }).slice(0, 3);
    var avoid = picks.slice().reverse().filter(function (p) { return p.signal === "short"; }).slice(0, 3);
    h += '<section aria-labelledby="recoTitle"><div class="sec-head"><div><h2 id="recoTitle">Empfehlungen</h2><p>Die stärksten Signale dieses Berichts. Antippen öffnet die vollständige Begründung mit Chart.</p></div></div>';
    h += '<div class="ideas">' + ideaList("Kaufideen", "long", buys, "Long-Signal, absteigend nach Punkten") + ideaList("Lieber meiden", "short", avoid, "Short-Kandidaten, schwächste zuerst") + "</div></section>";

    h += '<section class="card-box" aria-labelledby="tmTitle"><div class="sec-head"><div><h2 id="tmTitle">Signal-Heatmap</h2><p>Alle bewerteten Aktien. Je größer und kräftiger die Kachel, desto stärker das Signal.</p></div></div>';
    h += '<div class="tm" id="tm" role="group" aria-label="Signal-Heatmap"></div>';
    h += '<div class="scale"><span>Short ' + signed(L.shortMax) + "</span><i></i><span>Long " + signed(L.longMin) + "</span><span>· Farbe nach Punkten, Größe nach Stärke des Signals</span></div></section>";

    h += '<section class="card-box" aria-labelledby="hmTitle"><div class="sec-head"><div><h2 id="hmTitle">Markt-Heatmap live</h2><p>Kursveränderung nach Sektor, Kachelgröße nach Börsenwert.</p></div>';
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg" role="group" aria-label="Index">' + HM_SRC.map(function (x) { return '<button type="button" data-hs="' + x[0] + '" aria-pressed="' + (x[0] === hmSrc) + '">' + x[1] + "</button>"; }).join("") + "</div>";
    h += '<div class="seg" role="group" aria-label="Zeitraum">' + HM_PER.map(function (x) { return '<button type="button" data-hp="' + x[0] + '" aria-pressed="' + (x[0] === hmPer) + '">' + x[1] + "</button>"; }).join("") + "</div></div></div>";
    h += '<div class="hm-live" id="hmLive"></div></section>';

    var tags = ["Alle"];
    arr(r.news).forEach(function (n) { if (n.tag && tags.indexOf(n.tag) < 0) tags.push(n.tag); });
    h += '<section><div class="tabs" role="tablist" aria-label="Bereiche">';
    [["watch", "Watchlist", picks.length], ["news", "Nachrichten", arr(r.news).length], ["cal", "Termine", arr(r.calendar).length]].forEach(function (t) {
      h += '<button type="button" role="tab" id="tab-' + t[0] + '" aria-controls="panel-' + t[0] + '" aria-selected="' + (tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '<span class="cnt">' + t[2] + "</span></button>";
    });
    h += "</div>";

    h += '<div class="panel" role="tabpanel" id="panel-watch" aria-labelledby="tab-watch"' + (tab === "watch" ? "" : " hidden") + ">";
    h += '<div class="wl-tools"><div class="filters" style="margin:0" role="group" aria-label="Watchlist filtern">' + [["alle", "Alle"], ["long", "Long"], ["neutral", "Neutral"], ["short", "Short"]].map(function (x) { return '<button type="button" class="chip" data-w="' + x[0] + '" aria-pressed="' + (wlFilter === x[0]) + '">' + x[1] + "</button>"; }).join("") + "</div>";
    h += '<span class="livenote">Spaltenköpfe sortieren · Zeile antippen für Details</span></div>';
    h += '<div class="tbl-wrap"><table class="wl"><thead><tr><th>#</th>' + th("name", "Aktie") + th("sector", "Sektor") + th("act", "Empfehlung") + th("score", "Punkte") + th("conf", "Zuversicht");
    CAT.forEach(function (c) { h += th(c[0], CSHORT[c[0]], true, c[1]); });
    h += '</tr></thead><tbody id="wlBody"></tbody></table></div>';
    h += '<details class="live" id="liveQuotes"><summary>Live-Kurse aller Aktien der Watchlist anzeigen</summary><div class="box" id="liveBox"></div></details></div>';

    h += '<div class="panel" role="tabpanel" id="panel-news" aria-labelledby="tab-news"' + (tab === "news" ? "" : " hidden") + '><div class="filters" role="group" aria-label="Nachrichten filtern">';
    tags.forEach(function (t) { h += '<button type="button" class="chip" data-f="' + esc(t) + '" aria-pressed="' + (newsFilter === t) + '">' + esc(t) + "</button>"; });
    h += '</div><div class="news" id="newsList"></div></div>';

    h += '<div class="panel" role="tabpanel" id="panel-cal" aria-labelledby="tab-cal"' + (tab === "cal" ? "" : " hidden") + '><ol class="timeline">';
    arr(r.calendar).forEach(function (c) {
      h += '<li><span class="when">' + esc(c.date) + '</span><span class="dot"></span><span class="what">' + esc(c.event) + (c.source ? ' <span class="links" style="display:inline">· ' + link(c.source) + "</span>" : "") + "</span></li>";
    });
    h += "</ol></div></section>";

    h += "<footer><p><strong>So entstehen die Einschätzungen.</strong> " + esc(r.methodNote || "") + (safeUrl(r.paperUrl) ? ' Grundlage ist das <a href="' + esc(r.paperUrl) + '" target="_blank" rel="noopener">Research Paper zu Long- und Short-Signalen</a>.' : "") + "</p>";
    h += "<p><strong>So entsteht die Empfehlung.</strong> Long mit hoher Zuversicht heißt Kaufen, mit mittlerer Zuversicht Kaufen mit kleiner Position, sonst Beobachten. Short-Kandidaten stehen unter Meiden; ein aktiver Short ist damit nicht gemeint.</p>";
    arr(r.excluded).forEach(function (x) { h += "<p><strong>Nicht bewertet: " + esc(x.name) + ".</strong> " + esc(x.reason) + "</p>"; });
    h += '<p>Live-Kurse, Charts, technische Indikatoren und die Markt-Heatmap stammen von <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> und sind teils verzögert. Sie fließen nicht in die Punkte ein.</p>';
    h += "<p>" + esc(r.disclaimer || "") + " Diese Seite ist passwortgeschützt und nur für den privaten Gebrauch bestimmt.</p>";
    if (r.generatedAt) h += "<p>Erstellt am " + fmtDate(r.generatedAt) + " von Claude auf Basis öffentlich zugänglicher Berichte.</p>";
    h += "</footer></main>";

    document.getElementById("app").innerHTML = h;
    renderNews();
    renderTable();
    layoutTreemap();
    liveHeatmap();
    bind();
    var t = (location.hash || "").replace("#", "");
    if (t && picks.some(function (p) { return p.ticker === t; })) openDrawer(t, false);
  }

  function ideaList(title, k, list, hint) {
    var h = '<div class="ilist" style="--cc:var(--' + k + ')"><h3>' + title + "<span>" + hint + "</span></h3>";
    if (!list.length) h += '<div class="empty">In diesem Bericht keine Aktie mit diesem Signal.</div>';
    list.forEach(function (p, i) {
      h += '<button type="button" class="idea" data-t="' + esc(p.ticker) + '"><span class="rk">' + (i + 1) + '</span><span><span class="nm">' + esc(p.name) + "<small>" + esc(p.ticker) + "</small></span><br>" + actPill(p, true) + "</span>" + ring(p) + '<span class="hl">' + esc(p.headline) + "</span></button>";
    });
    return h + "</div>";
  }

  /* Signal-Heatmap als Treemap, gruppiert nach Signal */
  function squarify(items, x, y, w, h) {
    var out = [], row = [], R = { x: x, y: y, w: w, h: h };
    var sumV = items.reduce(function (a, it) { return a + it.v; }, 0) || 1;
    var f = (w * h) / sumV;
    var vals = items.map(function (it) { return { it: it, a: it.v * f }; });
    function worst(rw, side) {
      var s = 0, mx = 0, mn = Infinity;
      rw.forEach(function (o) { s += o.a; mx = Math.max(mx, o.a); mn = Math.min(mn, o.a); });
      return s ? Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)) : Infinity;
    }
    function lay(rw) {
      var s = rw.reduce(function (a, o) { return a + o.a; }, 0);
      if (R.w >= R.h) { var cw = s / R.h, yy = R.y; rw.forEach(function (o) { var hh = o.a / cw; out.push({ it: o.it, x: R.x, y: yy, w: cw, h: hh }); yy += hh; }); R.x += cw; R.w -= cw; }
      else { var rh = s / R.w, xx = R.x; rw.forEach(function (o) { var ww = o.a / rh; out.push({ it: o.it, x: xx, y: R.y, w: ww, h: rh }); xx += ww; }); R.y += rh; R.h -= rh; }
    }
    var i = 0;
    while (i < vals.length) {
      var side = Math.min(R.w, R.h);
      if (!row.length || worst(row.concat([vals[i]]), side) <= worst(row, side)) { row.push(vals[i]); i++; }
      else { lay(row); row = []; }
    }
    if (row.length) lay(row);
    return out;
  }
  function layoutTreemap() {
    var el = document.getElementById("tm");
    if (!el || !current) return;
    var W = el.clientWidth, H = el.clientHeight;
    if (!W || !H) return;
    var groups = ["long", "neutral", "short"].map(function (k) {
      var list = arr(current.picks).filter(function (p) { return (SIG[p.signal] ? p.signal : "neutral") === k; })
        .map(function (p) { return { p: p, v: 2 + Math.abs(total(p)) }; })
        .sort(function (a, b) { return b.v - a.v; });
      return { k: k, list: list, v: list.reduce(function (a, o) { return a + o.v; }, 0) };
    }).filter(function (g) { return g.list.length; });
    var all = groups.reduce(function (a, g) { return a + g.v; }, 0) || 1;
    var vertical = W < 640, GAP = 10, HEAD = 22, pos = 0, html = "";
    var avail = (vertical ? H : W) - GAP * (groups.length - 1);
    groups.forEach(function (g) {
      var size = avail * g.v / all;
      var gx = vertical ? 0 : pos, gy = vertical ? pos : 0, gw = vertical ? W : size, gh = vertical ? size : H;
      pos += size + GAP;
      html += '<div class="grp" style="left:' + gx + "px;top:" + gy + "px;width:" + gw + "px;color:var(--" + g.k + ')">' + SIG[g.k].col + " · " + g.list.length + "</div>";
      squarify(g.list, gx, gy + HEAD, gw, gh - HEAD).forEach(function (c) {
        var p = c.it.p, t = total(p), a = action(p);
        var w = c.w - 3, hh = c.h - 3, m = Math.min(w, hh);
        var fs = Math.max(11, Math.min(26, m / 3.6));
        var inner = '<span class="ct" style="font-size:' + fs.toFixed(0) + 'px">' + esc(p.ticker) + "</span>";
        if (w > 64 && hh > 44) inner += '<span class="cs">' + signed(t) + "</span>";
        if (w > 110 && hh > 92) inner += '<span class="cn">' + esc(p.name) + '</span><span class="ca">' + esc(a.short) + "</span>";
        html += '<button type="button" class="cell" data-t="' + esc(p.ticker) + '" style="left:' + (c.x + 1.5).toFixed(1) + "px;top:" + (c.y + 1.5).toFixed(1) + "px;width:" + w.toFixed(1) + "px;height:" + hh.toFixed(1) + "px;background:" + heat(t, 10) + '" aria-label="' + esc(p.name) + ", " + signed(t) + " Punkte, " + esc(a.label) + '" title="' + esc(p.name) + ": " + esc(p.headline) + '">' + inner + "</button>";
      });
    });
    el.innerHTML = html;
  }

  /* Watchlist-Tabelle */
  var CSHORT = { ereignisse: "Ereign.", analysten: "Analyst.", trend: "Trend", positionierung: "Posit.", qualitaet: "Qualität", bewertung: "Bewert." };
  var wlFilter = "alle", wlSort = { k: "score", d: -1 };
  function th(k, label, center, title) {
    return '<th' + (center ? ' class="c"' : "") + (title ? ' title="' + esc(title) + '"' : "") + '><button type="button" data-sort="' + k + '" aria-sort="' + (wlSort.k === k ? (wlSort.d < 0 ? "descending" : "ascending") : "none") + '">' + esc(label) + "</button></th>";
  }
  function sortVal(p, k) {
    if (k === "name") return String(p.name || "").toLowerCase();
    if (k === "sector") return String(p.sector || "").toLowerCase();
    if (k === "score") return total(p);
    if (k === "act") return action(p).rank * 100 + total(p);
    if (k === "conf") return { hoch: 3, mittel: 2, niedrig: 1 }[p.confidence] || 0;
    return Number((p.scores || {})[k]) || 0;
  }
  function renderTable() {
    var body = document.getElementById("wlBody");
    if (!body) return;
    var list = arr(current.picks).filter(function (p) { return wlFilter === "alle" || (SIG[p.signal] ? p.signal : "neutral") === wlFilter; });
    list.sort(function (a, b) {
      var x = sortVal(a, wlSort.k), y = sortVal(b, wlSort.k);
      if (x < y) return -wlSort.d; if (x > y) return wlSort.d;
      return total(b) - total(a);
    });
    body.innerHTML = list.map(function (p, i) {
      var t = total(p), k = sig(p).cls, sc = p.scores || {};
      var bw = Math.min(Math.abs(t), 12) / 12 * 50;
      var h = '<tr data-t="' + esc(p.ticker) + '"><td class="mono" style="color:var(--faint)">' + (i + 1) + "</td>";
      h += '<td><button type="button" class="nmb" data-t="' + esc(p.ticker) + '"><b>' + esc(p.name) + "</b><span>" + esc(p.ticker) + " · " + esc(p.market) + "</span></button></td>";
      h += '<td style="color:var(--muted)">' + esc(p.sector) + "</td><td>" + actPill(p) + "</td>";
      h += '<td><span class="sc" style="color:var(--' + k + ')">' + signed(t) + '<i><b style="background:var(--' + k + ");" + (t >= 0 ? "left:50%" : "right:50%") + ";width:" + bw + '%"></b></i></span></td>';
      h += '<td style="--cc:var(--' + k + ')">' + confDots(p.confidence) + "</td>";
      CAT.forEach(function (c) { var v = Number(sc[c[0]]) || 0; h += '<td class="c"><span class="hc" style="background:' + heat(v, 2) + '">' + signed(v) + "</span></td>"; });
      return h + "</tr>";
    }).join("") || '<tr><td colspan="12" style="color:var(--faint)">Keine Aktie mit diesem Signal.</td></tr>';
    Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function (b) {
      var k = b.getAttribute("data-sort");
      b.setAttribute("aria-sort", wlSort.k === k ? (wlSort.d < 0 ? "descending" : "ascending") : "none");
    });
  }
  function liveQuotes() {
    var box = document.getElementById("liveBox");
    if (!box || box.firstChild) return;
    var groups = ["long", "neutral", "short"].map(function (k) {
      var syms = arr(current.picks).filter(function (p) { return (SIG[p.signal] ? p.signal : "neutral") === k && tvSym(p); })
        .sort(function (a, b) { return total(b) - total(a); })
        .map(function (p) { return { name: tvSym(p), displayName: String(p.name || p.ticker) }; });
      return { name: SIG[k].col, originalName: SIG[k].col, symbols: syms };
    }).filter(function (g) { return g.symbols.length; });
    box.innerHTML = tvFrame("market-quotes", { width: "100%", height: "100%", symbolsGroups: groups, showSymbolLogo: true, isTransparent: true, colorTheme: "dark", locale: "de_DE" }, "Live-Kurse der Watchlist", "100%", false);
  }

  function renderNews() {
    var el = document.getElementById("newsList");
    if (!el) return;
    var list = arr(current.news).filter(function (n) { return newsFilter === "Alle" || n.tag === newsFilter; });
    el.innerHTML = list.map(function (n) {
      return '<article><div class="top"><span class="mono">' + esc(n.date) + '</span><span class="tag">' + esc(n.tag) + "</span></div><h3>" + esc(n.title) + "</h3><p>" + esc(n.text) + '</p><div class="links">' + arr(n.sources).map(link).join("") + "</div></article>";
    }).join("") || '<div class="col-empty">Keine Nachrichten in dieser Kategorie.</div>';
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      b.addEventListener("click", function () {
        tab = b.getAttribute("data-tab");
        Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (x) { x.setAttribute("aria-selected", String(x === b)); });
        ["watch", "news", "cal"].forEach(function (k) { document.getElementById("panel-" + k).hidden = k !== tab; });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-f]"), function (c) {
      c.addEventListener("click", function () {
        newsFilter = c.getAttribute("data-f");
        Array.prototype.forEach.call(document.querySelectorAll(".chip[data-f]"), function (x) { x.setAttribute("aria-pressed", String(x === c)); });
        renderNews();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-w]"), function (c) {
      c.addEventListener("click", function () {
        wlFilter = c.getAttribute("data-w");
        Array.prototype.forEach.call(document.querySelectorAll(".chip[data-w]"), function (x) { x.setAttribute("aria-pressed", String(x === c)); });
        renderTable();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var k = b.getAttribute("data-sort");
        if (wlSort.k === k) wlSort.d = -wlSort.d; else wlSort = { k: k, d: k === "name" || k === "sector" ? 1 : -1 };
        renderTable();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-hs],[data-hp]"), function (b) {
      b.addEventListener("click", function () {
        if (b.hasAttribute("data-hs")) hmSrc = b.getAttribute("data-hs"); else hmPer = b.getAttribute("data-hp");
        Array.prototype.forEach.call(document.querySelectorAll("[data-hs]"), function (x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-hs") === hmSrc)); });
        Array.prototype.forEach.call(document.querySelectorAll("[data-hp]"), function (x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-hp") === hmPer)); });
        liveHeatmap();
      });
    });
    var lq = document.getElementById("liveQuotes");
    if (lq) lq.addEventListener("toggle", function () { if (lq.open) liveQuotes(); });
  }
  /* Ein Klick auf Kachel, Idee oder Tabellenzeile öffnet die Detailansicht */
  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest("[data-t]");
    if (el && current) openDrawer(el.getAttribute("data-t"), true);
  });

  /* Detailansicht */
  function orderedPicks() { return arr(current && current.picks).slice().sort(function (a, b) { return total(b) - total(a); }); }
  function openDrawer(ticker, setHash) {
    var list = orderedPicks();
    var p = list.filter(function (x) { return x.ticker === ticker; })[0];
    if (!p) return;
    if (!openTicker) lastFocus = document.activeElement;
    openTicker = ticker;
    var s = sig(p), t = total(p), sc = p.scores || {};
    var h = '<div class="d-hero" style="--cc:var(--' + s.cls + ')"><div><div class="row"><span class="pill c-' + s.cls + " bg-" + s.cls + '">' + s.label + '</span><span class="sum">Zuversicht ' + esc(p.confidence) + " " + confDots(p.confidence) + "</span></div>";
    h += '<h2 id="dTitle">' + esc(p.name) + "</h2>";
    h += '<div class="sub mono">' + esc(p.ticker) + " · " + esc(p.market) + " · " + esc(p.sector) + "</div></div>" + ring(p, true) + "</div>";
    var a = action(p), ts = tvSym(p);
    h += '<div class="reco" style="--cc:var(--' + a.cls + ')"><div class="eyebrow">Unsere Empfehlung</div><div class="big">' + esc(a.label) + "</div>";
    h += "<p><b>Umsetzung:</b> " + esc(p.implementation) + "</p><p><b>Das kippt die Einschätzung:</b> " + esc(p.invalidation) + "</p></div>";
    h += '<div class="sec"><div class="headline">' + esc(p.headline) + "</div>";
    if (p.priceInfo) h += '<div class="sum">' + esc(p.priceInfo) + "</div>";
    h += "</div>";
    if (ts) {
      h += '<div class="sec"><div class="eyebrow">Kurs und Technik live</div><div class="charts"><div>' +
        tvFrame("mini-symbol-overview", { symbol: ts, width: "100%", height: "100%", dateRange: "12M", colorTheme: "dark", isTransparent: true, autosize: true, largeChartUrl: "" }, "Kursverlauf " + p.name, "380px", false) + "</div><div>" +
        tvFrame("technical-analysis", { interval: "1D", width: "100%", isTransparent: true, height: "100%", symbol: ts, showIntervalTabs: true, displayMode: "single", locale: "de_DE", colorTheme: "dark" }, "Technische Indikatoren " + p.name, "380px", false) +
        '</div></div><p class="livenote" style="margin:0">Live von TradingView, teils verzögert. Die technischen Signale rechnet TradingView automatisch aus Indikatoren wie gleitenden Durchschnitten; sie fließen nicht in unsere Punkte ein.</p></div>';
    }
    h += '<div class="sec"><div class="eyebrow">Was passiert ist</div><p>' + esc(p.whatHappened) + "</p>";
    if (p.conflictNote) h += '<div class="note">' + esc(p.conflictNote) + "</div>";
    h += "</div>";
    h += '<div class="sec"><div class="eyebrow">Punkte je Kategorie</div><div class="bars">';
    CAT.forEach(function (c) {
      var v = Number(sc[c[0]]) || 0;
      h += '<div class="brow"><span>' + c[1] + '</span><span class="btrack">' + (v ? '<span class="bfill ' + (v > 0 ? "pos" : "neg") + '" style="width:' + (Math.abs(v) / 2 * 50) + '%"></span>' : "") + '</span><span class="v">' + signed(v) + "</span></div>";
    });
    var L = lightInfo(current);
    h += '</div><div class="sum">Summe mit doppelt gewichteten Ereignissen: <b class="mono">' + signed(t) + "</b>. Long ab " + signed(L.longMin) + ", Short-Kandidat ab " + signed(L.shortMax) + " (Marktampel " + L.name + ").</div></div>";
    h += '<div class="sec"><div class="eyebrow">Gründe im Vergleich</div><div class="pc">';
    h += '<div class="pcb l"><h4>Warum Long</h4><ul>' + arr(p.longReasons).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    h += '<div class="pcb s"><h4>Warum Short</h4><ul>' + arr(p.shortReasons).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div></div>";
    h += '<div class="facts">';
    h += '<div class="fact"><h4>Schon im Kurs?</h4><p>' + esc(p.pricedIn) + "</p></div>";
    h += '<div class="fact"><h4>Nächste Termine</h4><ul>' + arr(p.catalysts).map(function (c) { return '<li><span class="mono">' + esc(c.date) + "</span>: " + esc(c.event) + "</li>"; }).join("") + "</ul></div>";
    h += "</div>";
    h += '<div class="sec"><div class="eyebrow">Quellen</div><ol class="srcs">' + arr(p.sources).map(function (src) { return "<li>" + link(src) + (src.title ? " <span>" + esc(src.title) + "</span>" : "") + "</li>"; }).join("") + "</ol></div>";
    var body = document.getElementById("dBody");
    body.innerHTML = h;
    body.scrollTop = 0;
    var d = document.getElementById("drawer");
    d.classList.add("open");
    d.setAttribute("aria-hidden", "false");
    document.getElementById("scrim").classList.add("open");
    document.body.style.overflow = "hidden";
    if (setHash) { try { history.replaceState(null, "", "#" + ticker); } catch (e) {} }
    document.getElementById("closeBtn").focus({ preventScroll: true });
  }
  function closeDrawer() {
    if (!openTicker) return;
    openTicker = null;
    var d = document.getElementById("drawer");
    d.classList.remove("open");
    d.setAttribute("aria-hidden", "true");
    document.getElementById("scrim").classList.remove("open");
    document.body.style.overflow = "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function step(dir) {
    var list = orderedPicks();
    var i = list.findIndex(function (p) { return p.ticker === openTicker; });
    if (i < 0) return;
    openDrawer(list[(i + dir + list.length) % list.length].ticker, true);
  }
  document.getElementById("closeBtn").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.getElementById("prevBtn").addEventListener("click", function () { step(-1); });
  document.getElementById("nextBtn").addEventListener("click", function () { step(1); });
  document.addEventListener("keydown", function (e) {
    if (!openTicker) return;
    if (e.key === "Escape") closeDrawer();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "Tab") {
      var f = document.getElementById("drawer").querySelectorAll("button, a[href]");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener("hashchange", function () {
    var t = (location.hash || "").replace("#", "");
    if (t && current && t !== openTicker) openDrawer(t, false);
  });
  var rz;
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (current) layoutTreemap(); }, 120); });

  /* Entschlüsselung */
  function b64ToBytes(s) { var bin = atob(String(s || "")); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function bytesToB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function getJSON(p) {
    return fetch("data/" + p + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("Datei " + p + " nicht gefunden (HTTP " + r.status + ").");
      return r.json();
    }, function () { throw new Error("Keine Verbindung zum Server."); });
  }
  function storeGet() { try { return sessionStorage.getItem(KEY_STORE) || localStorage.getItem(KEY_STORE); } catch (e) { return null; } }
  function storeSet(v, remember) { try { sessionStorage.setItem(KEY_STORE, v); if (remember) localStorage.setItem(KEY_STORE, v); } catch (e) {} }
  function storeClear() { try { sessionStorage.removeItem(KEY_STORE); localStorage.removeItem(KEY_STORE); } catch (e) {} }
  async function unwrapPrivateKey(password, keyring) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var k = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: keyring.kdf.hash, salt: b64ToBytes(keyring.kdf.salt), iterations: keyring.kdf.iterations }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(keyring.wrap.iv) }, k, b64ToBytes(keyring.encryptedPrivateKey));
  }
  function importPrivateKey(pkcs8) { return crypto.subtle.importKey("pkcs8", pkcs8, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]); }
  async function decryptReport(date) {
    if (cache[date]) return cache[date];
    var e = await getJSON("reports/" + date + ".json.enc");
    var raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, privKey, b64ToBytes(e.key));
    var aes = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(e.iv) }, aes, b64ToBytes(e.data));
    cache[date] = JSON.parse(new TextDecoder().decode(plain));
    return cache[date];
  }
  async function show(date) {
    try {
      current = await decryptReport(date);
      var sel = document.getElementById("reportSelect");
      sel.innerHTML = reports.map(function (r) { return '<option value="' + esc(r.date) + '"' + (r.date === current.date ? " selected" : "") + ">" + fmtDate(r.date) + "</option>"; }).join("");
      sel.disabled = reports.length < 2;
      render();
    } catch (err) {
      setState("Der Bericht vom " + fmtDate(date) + " konnte nicht geöffnet werden. " + (err && err.message ? err.message : ""));
    }
  }
  async function afterUnlock() {
    document.getElementById("ctl").hidden = false;
    setState("Bericht wird entschlüsselt.");
    try {
      var idx = await getJSON("index.json");
      reports = (idx.reports || []).filter(function (r) { return r && /^\d{4}-\d{2}-\d{2}$/.test(r.date); });
    } catch (err) { setState("Die Liste der Berichte konnte nicht geladen werden. " + err.message); return; }
    if (!reports.length) { setState("Noch kein Bericht vorhanden. Der erste erscheint nach der nächsten automatischen Aktualisierung."); return; }
    await show(reports[0].date);
  }
  function loginForm(msg) {
    privKey = null; cache = {}; current = null;
    closeDrawer();
    document.getElementById("ctl").hidden = true;
    document.getElementById("app").innerHTML =
      '<div class="gate"><div class="radar" aria-hidden="true"></div><form class="login" id="loginForm">' +
      '<div class="eyebrow">Privater Bereich</div><h1>Börsenradar</h1>' +
      "<p>Marktlage, Nachrichten und Long- oder Short-Signale. Die Berichte sind verschlüsselt; mit deinem Passwort öffnest du sie.</p>" +
      '<input type="text" name="username" autocomplete="username" value="Börsenradar" hidden>' +
      '<label for="pw">Passwort</label><input id="pw" name="password" type="password" autocomplete="current-password" required>' +
      '<label class="rem" for="remember"><input id="remember" type="checkbox"> Auf diesem Gerät angemeldet bleiben</label>' +
      '<button type="submit" class="btn" id="loginBtn">Öffnen</button><p class="err" id="loginErr" role="alert">' + esc(msg || "") + "</p></form></div>";
    var pw = document.getElementById("pw");
    try { pw.focus(); } catch (e) {}
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = document.getElementById("loginBtn"), errEl = document.getElementById("loginErr");
      btn.disabled = true; btn.textContent = "Wird geprüft"; errEl.textContent = "";
      var keyring;
      try { keyring = await getJSON("keyring.json"); } catch (err) { errEl.textContent = err.message; btn.disabled = false; btn.textContent = "Öffnen"; return; }
      try {
        var pkcs8 = await unwrapPrivateKey(pw.value, keyring);
        privKey = await importPrivateKey(pkcs8);
        storeSet(bytesToB64(pkcs8), document.getElementById("remember").checked);
      } catch (err) {
        errEl.textContent = "Das Passwort stimmt nicht."; btn.disabled = false; btn.textContent = "Öffnen"; pw.select(); return;
      }
      afterUnlock();
    });
  }
  document.getElementById("reportSelect").addEventListener("change", function (e) { if (privKey) { closeDrawer(); show(e.target.value); } });
  document.getElementById("logoutBtn").addEventListener("click", function () { storeClear(); loginForm("Du bist abgemeldet."); });

  (async function init() {
    if (!window.crypto || !crypto.subtle) { setState("Dieser Browser unterstützt die Entschlüsselung nicht. Öffne die Seite über https in einem aktuellen Browser."); return; }
    var saved = storeGet();
    if (saved) {
      try { privKey = await importPrivateKey(b64ToBytes(saved)); afterUnlock(); return; } catch (e) { storeClear(); }
    }
    loginForm("");
  })();
